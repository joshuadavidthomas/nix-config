# Grafana loads the dashboards in /etc/grafana/dashboards at start (monitor/machine.json):
# Homelab (overview.json, its home page), Capacity, VMs, Machine (box.json), Logs and Monitor,
# written here (docs/monitor.md#dashboards), and Node Exporter Full (grafana.com 1860,
# revision 45). Changes made in Grafana
# are not saved; change the JSON here.
apiVersion: 1
providers:
  - name: monitor
    type: file
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
