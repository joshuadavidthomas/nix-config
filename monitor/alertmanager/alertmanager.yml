# Alertmanager on the monitor (monitor/machine.json, docs/monitor.md). Every alert goes to
# hark, through the relay in monitor/hark/relay.py; resolving one sends a second message. The
# Watchdog goes through the relay to the heartbeat Worker on Cloudflare (monitor/heartbeat).
route:
  receiver: hark
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # About every minute: the Worker says the monitor is silent after 5 minutes without it.
    # Alertmanager checks a repeat only at a group_interval tick, so with both at 1m a repeat
    # due a moment after a tick waits for the next one, and pings come every 2 minutes.
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 30s

# A box that is silent sends nothing else, so its other alerts are noise.
inhibit_rules:
  - source_matchers: [alertname="BoxSilent"]
    target_matchers: [alertname!="BoxSilent"]
    equal: [instance]

receivers:
  - name: hark
    webhook_configs:
      - url: http://127.0.0.1:9099/
        send_resolved: true
  - name: heartbeat
    webhook_configs:
      - url: http://127.0.0.1:9099/heartbeat
