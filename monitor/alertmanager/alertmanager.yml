# Alertmanager on the monitor (monitor/machine.json, docs/monitor.md). Alerts will go to hark,
# through a relay that isn't built yet; until then they go nowhere, and Grafana shows them
# under Alerting.
route:
  receiver: nowhere
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # For the heartbeat, when it exists.
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat

# A box that is silent sends nothing else, so its other alerts are noise.
inhibit_rules:
  - source_matchers: [alertname="BoxSilent"]
    target_matchers: [alertname!="BoxSilent"]
    equal: [instance]

receivers:
  - name: nowhere
  - name: heartbeat
