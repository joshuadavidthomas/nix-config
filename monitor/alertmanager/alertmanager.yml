# Alertmanager on the monitor (monitor/machine.json, docs/monitor.md). The Discord webhook is
# the Fly secret DISCORD_WEBHOOK_URL, which the container writes to a file at start.
route:
  receiver: discord
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # For the heartbeat Worker, when it exists; until then, nowhere.
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat

# A box that is silent sends nothing else, so its other alerts are noise.
inhibit_rules:
  - source_matchers: [alertname="BoxSilent"]
    target_matchers: [alertname!="BoxSilent"]
    equal: [instance]

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /tmp/discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}: {{ .CommonLabels.alertname }}{{ with .CommonLabels.instance }} on {{ . }}{{ end }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  - name: heartbeat
