# The monitor's own logs into VictoriaLogs, next to the lab boxes' (docs/monitor.md). Fly sends
# every machine's output to its log stream (NATS, on the org's private network); this reads the
# monitor app's part with a read-only org token, FLY_LOG_TOKEN. Fly's records don't say which
# container wrote a line, so `container` comes from each program's own line format.
data_dir: /var/lib/vector
api:
  enabled: true
  address: 127.0.0.1:8686

sources:
  fly:
    type: nats
    url: nats://[fdaa::3]:4223
    subject: logs.homelab-monitor-joshthomasdev.>
    connection_name: homelab-monitor-logs
    auth:
      strategy: user_password
      user_password:
        user: personal
        password: ${FLY_LOG_TOKEN}
    decoding:
      codec: json

transforms:
  lines:
    type: remap
    inputs: [fly]
    source: |
      line = to_string(.message) ?? ""
      .container = if starts_with(line, "relay: ") {
        "hark"
      } else if contains(line, "logger=") {
        "grafana"
      } else if contains(line, "app/vmalert") {
        "vmalert"
      } else if contains(line, "VictoriaLogs") || contains(line, "app/victoria-logs") {
        "victorialogs"
      } else if contains(line, "VictoriaMetrics/") {
        "victoriametrics"
      } else if contains(line, "vector::") {
        "logs"
      } else if match(line, r'^time=\S+ level=\S+ source=') {
        "alertmanager"
      } else if match(line, r'^(boot: |\d{4}/\d\d/\d\d \d\d:\d\d:\d\d )') {
        "tailscale"
      } else if match(line, r'^\s*(INFO|WARN|ERROR|DEBUG) ') || contains(line, " container ") {
        "fly"
      } else {
        "other"
      }
      .host = "monitor"
      .level = .log.level
      del(.log)
      del(.event)
      del(.fly)

sinks:
  victorialogs:
    type: elasticsearch
    inputs: [lines]
    endpoints: [http://127.0.0.1:9428/insert/elasticsearch/]
    mode: bulk
    api_version: v8
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: host,container
