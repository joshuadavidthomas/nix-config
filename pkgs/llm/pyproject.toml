# llm and its plugins, locked with uv and built by uv2nix (see default.nix).
# nixpkgs trails llm 0.36 and its dependency stack (openai 3, httpx2, jiter).
# To update: bump the pins, then `uv lock`.
[project]
name = "llm-env"
version = "0"
requires-python = ">=3.13"
dependencies = [
  "llm==0.36",
  "llm-anthropic==0.29",
  "llm-deepseek==0.1.6",
  "llm-docs==0.2.1",
  "llm-gemini==0.34",
  "llm-templates-fabric==0.2.1",
  "llm-templates-github==0.1",
]

[tool.uv]
package = false
# transitive versions match the working mise install
constraint-dependencies = [
  "annotated-types==0.8.0",
  "anthropic==1.8.0",
  "anyio==4.15.1",
  "certifi==2026.7.22",
  "click==8.5.0",
  "click-default-group==1.2.4",
  "condense-json==1.1",
  "docstring_parser==0.18.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpcore2==2.13.0",
  "httpx==0.28.1",
  "httpx2==2.13.0",
  "idna==3.20",
  "ijson==3.5.1",
  "jiter==0.17.0",
  "openai==3.18.0",
  "pluggy==1.6.0",
  "puremagic==2.2.0",
  "pydantic==2.13.5",
  "pydantic_core==2.46.5",
  "python-dateutil==2.9.0.post0",
  "python-ulid==4.0.1",
  "PyYAML==6.0.3",
  "six==1.17.0",
  "sniffio==1.3.1",
  "sqlite-fts4==1.0.3",
  "sqlite-utils==4.2.1",
  "tabulate==0.10.0",
  "truststore==0.10.4",
  "typing_extensions==4.16.0",
  "typing-inspection==0.4.4",
  "uv==0.12.17",
]
